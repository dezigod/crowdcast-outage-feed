name: Monitor delivered feed
on:
  schedule:
    - cron: '9,24,39,54 * * * *'
  workflow_dispatch:
    inputs:
      verify_alerts:
        description: 'Send and close a clearly labeled test alert for the owner'
        type: boolean
        default: false
  workflow_run:
    workflows: ["Update reviewed outage feed"]
    types: [completed]
permissions:
  contents: read
  issues: write
concurrency:
  group: feed-freshness-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check published source timestamps and report incident
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_feed_health.py outage --repository "${{ github.repository }}"
      - name: Check WAPA schedule revisions and date coverage
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_feed_health.py rotation --deduplicate-known-incident --repository "${{ github.repository }}"
      - name: Independently check cruise feed delivery
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_feed_health.py cruise --repository dezigod/cruise-schedule-app --alert-repository dezigod/crowdcast-outage-feed
      - name: Verify owner alert and recovery permissions
        if: always() && github.event_name == 'workflow_dispatch' && inputs.verify_alerts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          issue_url=$(gh issue create --repo "${{ github.repository }}" --title '[TEST] CrowdCast alert delivery verification' --body '@dezigod This is an authorized notification test. The feed has not been interrupted or changed. This test issue will close automatically after creation succeeds.')
          gh issue view "$issue_url" --json number,state,url
          gh issue close "$issue_url" --comment '@dezigod Alert creation and recovery permissions verified. This was a test; no production feed failure was introduced.'

