name: One-time rotation access review November 13
on:
  push:
    branches: [main]
    paths: [.github/workflows/rotation-access-review-20261113.yml]
permissions:
  contents: read
jobs:
  review:
    if: github.event.head_commit.message == 'Run one-time read-only WAPA access review 2026-11-13'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check official endpoints once without changing feed
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json
          from datetime import datetime, timezone
          from urllib.error import HTTPError
          from urllib.parse import urlparse
          from urllib.request import Request, build_opener
          from outage_backend.collect import NoRedirect, PermissionRequired
          from outage_backend.rotation import ALERTS, schedule_url, PDF
          if datetime.now(timezone.utc).date().isoformat() != '2026-11-13':
              raise SystemExit('Expired one-time diagnostic; no source request made')
          class ReviewRedirect(NoRedirect):
              def redirect_request(self, request, file, code, message, headers, url):
                  print(json.dumps({'stage': 'redirect', 'status': code, 'destinationHost': urlparse(url).hostname, 'retryAfter': headers.get('Retry-After')}))
                  return super().redirect_request(request, file, code, message, headers, url)
          def once(url, limit):
              try:
                  request = Request(url, headers={'User-Agent': 'CrowdCast public WAPA schedule monitor'})
                  with build_opener(ReviewRedirect).open(request, timeout=15) as response:
                      body = response.read(limit + 1)
                      print(json.dumps({'url': url, 'status': response.status, 'retryAfter': response.headers.get('Retry-After'), 'lastModified': response.headers.get('Last-Modified'), 'bytes': len(body), 'sha256': hashlib.sha256(body).hexdigest()}))
                      if len(body) > limit:
                          raise SystemExit('Oversized response; stopped')
                      return body
              except HTTPError as error:
                  print(json.dumps({'url': url, 'status': error.code, 'retryAfter': error.headers.get('Retry-After')}))
                  error.close()
                  raise SystemExit('Access response requires review; no retry')
              except (PermissionRequired, OSError):
                  raise SystemExit('Access or network check stopped; no retry')
          html = once(ALERTS, 1_000_000)
          url = schedule_url(html)
          if not PDF.fullmatch(url):
              raise SystemExit('Unapproved URL; stopped')
          body = once(url, 8_000_000)
          if not body.startswith(b'%PDF-'):
              raise SystemExit('Not a PDF; stopped')
          print('Both official endpoints returned permitted responses. No state, timestamp, feed, or backoff was changed.')
          PY
