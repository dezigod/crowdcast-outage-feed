name: Recheck unresolved St. Thomas parcels
on:
  workflow_dispatch:
  schedule:
    - cron: '23 14 * * 1'
permissions:
  contents: read
concurrency:
  group: st-thomas-parcel-review
  cancel-in-progress: false
jobs:
  review:
    if: github.repository == 'dezigod/crowdcast-outage-feed' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 -m outage_backend.parcel_review
